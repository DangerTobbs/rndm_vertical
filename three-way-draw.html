<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-Way Draw</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one compact centred card, sized to sit inside a Notion embed */
:root{
  --bg:#f3f4f7; --card:#ffffff; --fg:#1d2230; --muted:#6b7183; --line:#dfe2ea;
  --accent:#3b5bdb; --accent-fg:#ffffff; --done:#9aa0b0;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161d; --card:#1d2029; --fg:#e8eaf1; --muted:#9aa0b3; --line:#2d313d;
  --accent:#7b93f5; --accent-fg:#10131c; --done:#5d6375; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161d; --card:#1d2029; --fg:#e8eaf1; --muted:#9aa0b3; --line:#2d313d;
  --accent:#7b93f5; --accent-fg:#10131c; --done:#5d6375; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.result{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.15;text-align:center;min-height:2.4em;
  display:flex;align-items:center;justify-content:center;text-wrap:balance;word-break:break-word}
.result.idle{color:var(--muted);font-weight:500;font-size:1.1rem}
.status{text-align:center;color:var(--muted);font-size:.85rem}
button{font:inherit;cursor:pointer;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#draw{background:var(--accent);color:var(--accent-fg);border:0;padding:14px;font-family:var(--display);font-weight:700;font-size:1.1rem}
#draw:disabled{background:var(--line);color:var(--muted);cursor:default}
.pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.85rem}
.chip.gone{color:var(--done);text-decoration:line-through}
details{font-size:.9rem}
summary{cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem}
.fields{display:flex;flex-direction:column;gap:8px;margin-top:12px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);padding:8px 12px}
@media (prefers-reduced-motion:no-preference){.result.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div id="result" class="result idle">Press draw</div>
    <button id="draw" type="button">Draw</button>
    <div id="pool" class="pool"></div>
    <div id="status" class="status"></div>
  </div>
  <details class="card">
    <summary>Edit values</summary>
    <div class="fields">
      <input id="v1" aria-label="Value 1">
      <input id="v2" aria-label="Value 2">
      <input id="v3" aria-label="Value 3">
      <div class="row">
        <button id="save" class="ghost" type="button">Save &amp; restart</button>
        <button id="reset" class="ghost" type="button">Restart draw</button>
      </div>
    </div>
  </details>
</div>

<script>
const KEY='three-way-draw-v1';
let state={values:['Option A','Option B','Option C'],drawn:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.values))state=s;}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function remaining(){return state.values.filter((_,i)=>!state.drawn.includes(i))}
function render(pop){
  const rem=state.values.map((_,i)=>i).filter(i=>!state.drawn.includes(i));
  const last=state.drawn[state.drawn.length-1];
  const r=$('result');
  if(last===undefined){r.textContent='Press draw';r.className='result idle'}
  else{r.textContent=state.values[last];r.className='result'+(pop?' pop':'')}
  $('pool').innerHTML='';
  state.values.forEach((v,i)=>{const c=document.createElement('span');
    c.className='chip'+(state.drawn.includes(i)?' gone':'');c.textContent=v;$('pool').appendChild(c)});
  const d=$('draw');
  if(rem.length===0){d.disabled=true;d.textContent='All drawn';$('status').textContent='Restart under Edit values to draw again'}
  else{d.disabled=false;d.textContent=rem.length===1?'Draw last one':'Draw';
    $('status').textContent=rem.length+' of 3 left in the pool'}
  state.values.forEach((v,i)=>$('v'+(i+1)).value=v);
}
$('draw').onclick=()=>{
  const rem=state.values.map((_,i)=>i).filter(i=>!state.drawn.includes(i));
  if(!rem.length)return;
  state.drawn.push(rem[Math.floor(Math.random()*rem.length)]);
  save();render(true);
};
$('save').onclick=()=>{
  state.values=[1,2,3].map(n=>$('v'+n).value.trim()||('Option '+n));
  state.drawn=[];save();render();
};
$('reset').onclick=()=>{state.drawn=[];save();render()};
render();
</script>
</body>
</html>
